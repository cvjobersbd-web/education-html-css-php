<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In · Escul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --teal: #14b8a6;
            --teal-dark: #0d9488;
            --orange: #f2760f;
            --dark: #1b2430;
            --gray-text: #5b6472;
            --light-bg: #f8fafb;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 40px;
            padding: 44px 40px 48px;
            box-shadow: 0 30px 60px -20px rgba(20, 30, 50, 0.25);
            transition: transform 0.2s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
        }

        /* header */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 6px;
        }

        .login-header h1 {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 28px;
            color: var(--dark);
            letter-spacing: -0.3px;
        }

        .login-header h1 span {
            color: var(--teal);
        }

        .login-header p {
            font-size: 14.5px;
            color: var(--gray-text);
            margin-top: 6px;
        }

        /* ===== FORM ===== */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--dark);
            letter-spacing: 0.2px;
        }

        .form-group label .req {
            color: #e74c3c;
            margin-left: 2px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #e4e9ed;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background: #fbfcfd;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.12);
            background: #ffffff;
        }

        /* password row */
        .password-row {
            position: relative;
        }

        .password-row input {
            padding-right: 52px;
        }

        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #9aa4af;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--dark);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        /* extra row (remember + forgot) */
        .extra-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13.5px;
            margin: 2px 0 4px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gray-text);
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--teal);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--teal);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--teal-dark);
            text-decoration: underline;
        }

        /* submit */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--teal);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 12px 24px -10px rgba(20, 184, 166, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }

        .login-btn:hover {
            background: var(--teal-dark);
            transform: translateY(-2px);
            box-shadow: 0 16px 30px -10px rgba(20, 184, 166, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn svg {
            width: 18px;
            height: 18px;
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 24px 0 16px;
            color: #c2c9d1;
            font-size: 13px;
            font-weight: 500;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e4e9ed;
        }

        /* ===== SOCIAL BUTTONS ===== */
        .social-login {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            border: 1.5px solid #e4e9ed;
            border-radius: 40px;
            background: #ffffff;
            font-weight: 600;
            font-size: 14px;
            color: var(--dark);
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            cursor: pointer;
        }

        .social-btn:hover {
            background: #f6f8f9;
            border-color: #cbd2d9;
            transform: translateY(-1px);
        }

        .social-btn.google:hover {
            background: #fef7f5;
            border-color: #f5c2b0;
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* ===== FOOTER LINK ===== */
        .signup-link {
            text-align: center;
            margin-top: 26px;
            font-size: 14px;
            color: var(--gray-text);
        }

        .signup-link a {
            color: var(--teal);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .signup-link a:hover {
            color: var(--teal-dark);
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px 36px;
                border-radius: 28px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .extra-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .social-btn {
                font-size: 13px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">

        <!-- ===== HEADER ===== -->
        <div class="login-header">
            <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 12C19 8 10 8 6 10V36C10 34 19 34 24 38V12Z" fill="var(--teal)"/>
                <path d="M24 12C29 8 38 8 42 10V36C38 34 29 34 24 38V12Z" fill="var(--orange)"/>
            </svg>
            <h1>Welcome <span>Back</span></h1>
            <p>Sign in to continue your learning journey</p>
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <form class="login-form" id="loginForm" autocomplete="off" novalidate>

            <!-- email -->
            <div class="form-group">
                <label for="email">Email Address <span class="req">*</span></label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>

            <!-- password -->
            <div class="form-group">
                <label for="password">Password <span class="req">*</span></label>
                <div class="password-row">
                    <input type="password" id="password" placeholder="Enter your password" required />
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- extra row -->
            <div class="extra-row">
                <label class="remember-me">
                    <input type="checkbox" id="remember" />
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <!-- submit -->
            <button type="submit" class="login-btn">
                Sign In
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
            </button>

        </form>

        <!-- ===== DIVIDER ===== -->
        <div class="divider">or sign in with</div>

        <!-- ===== SOCIAL BUTTONS ===== -->
        <div class="social-login">
            <button class="social-btn google">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>
        </div>

        <!-- ===== SIGNUP LINK ===== -->
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>

    </div>

    <script>
        (function() {
            "use strict";

            // ---- toggle password visibility ----
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    const svg = toggleBtn.querySelector('svg');
                    if (svg) {
                        if (type === 'text') {
                            svg.innerHTML = `
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            `;
                        } else {
                            svg.innerHTML = `
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            `;
                        }
                    }
                });
            }

            // ---- form validation ----
            const form = document.getElementById('loginForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;

                    if (!email || !email.includes('@') || !email.includes('.')) {
                        alert('Please enter a valid email address.');
                        return;
                    }

                    if (password.length < 6) {
                        alert('Password must be at least 6 characters long.');
                        return;
                    }

                    // demo success
                    alert('✅ Logged in successfully! (demo)');
                    // window.location.href = 'dashboard.html'; // uncomment to redirect
                });
            }

        })();
    </script>

</body>
</html>
